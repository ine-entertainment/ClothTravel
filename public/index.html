<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF5EE" />
  <title>未命名项目 · 旅行拍照租衣平台</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="stage">
    <aside class="intro">
      <div class="brand">
        <div class="brand-mark">未</div>
        <div>
          <b>未命名项目</b>
          <small>UNTITLED PROJECT · TRAVEL WARDROBE</small>
        </div>
      </div>

      <h1>把目的地旅拍<br />一次约好。</h1>
      <p>租衣、妆造、摄影、酒店送达与归还。一个手机里的旅行衣橱，帮女生把“拍照战衣”穿一次，也不用买回家。</p>

      <div class="intro-tags">
        <span>微信小程序原型</span>
        <span>三亚 · 首发城市</span>
        <span>可点击体验</span>
      </div>

      <nav class="intro-nav">
        <button data-action="tab" data-tab="home"><span>01 首页</span><span>发现</span></button>
        <button data-action="tab" data-tab="rent"><span>02 租衣</span><span>选款</span></button>
        <button data-action="go" data-screen="photo"><span>03 找摄影</span><span>预约</span></button>
        <button data-action="tab" data-tab="community"><span>04 社区</span><span>客片</span></button>
        <button data-action="tab" data-tab="profile"><span>05 我的</span><span>订单</span></button>
      </nav>

      <div class="intro-note">交互原型 v0.1 · 图片与数据仅作演示</div>
    </aside>

    <main class="phone-stage">
      <div class="phone">
        <div class="phone-screen">
          <div class="statusbar" id="statusbar">
            <span>9:41</span>
            <span class="status-icons">
              <svg width="17" height="11" viewBox="0 0 17 11" fill="none" aria-hidden="true"><rect x="0.5" y="7" width="2.4" height="3.5" rx="0.6" fill="currentColor"/><rect x="4.2" y="5.2" width="2.4" height="5.3" rx="0.6" fill="currentColor"/><rect x="7.9" y="3.1" width="2.4" height="7.4" rx="0.6" fill="currentColor"/><rect x="11.6" y="0.8" width="2.4" height="9.7" rx="0.6" fill="currentColor"/></svg>
              <svg width="15" height="11" viewBox="0 0 15 11" fill="none" aria-hidden="true"><path d="M1 3.8C3.8 1.2 11.2 1.2 14 3.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M3.4 6.2C5.2 4.7 9.8 4.7 11.6 6.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M6 8.6C6.7 8.1 8.3 8.1 9 8.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
              <svg width="23" height="11" viewBox="0 0 23 11" fill="none" aria-hidden="true"><rect x="0.5" y="0.8" width="19" height="9.4" rx="2.4" stroke="currentColor" opacity=".45"/><rect x="2" y="2.3" width="16" height="6.4" rx="1.4" fill="currentColor"/><path d="M21 4.2V6.8C21.8 6.5 22.2 5.8 22.2 5.5C22.2 5.2 21.8 4.5 21 4.2Z" fill="currentColor" opacity=".55"/></svg>
            </span>
          </div>

          <div id="app"></div>
          <div id="overlay" class="overlay" aria-live="polite"></div>
          <div id="toast" class="toast" role="status"></div>
          <div class="island" aria-hidden="true"></div>
        </div>
      </div>
      <div class="phone-caption">未命名项目 · 交互原型 <span>v0.1</span></div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
